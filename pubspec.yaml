name: paper_canvas
description: >-
  A multi-page handwriting and drawing canvas with configurable paper sizes,
  vector paper templates (lined, grid, dots, Cornell), an unbounded canvas mode,
  shape tools, and true vector PDF export and printing.
version: 0.1.0
repository: https://github.com/aahmadfaraz/paper_canvas
issue_tracker: https://github.com/aahmadfaraz/paper_canvas/issues

topics:
  - drawing
  - handwriting
  - canvas
  - pdf
  - notes

environment:
  # Color.toARGB32() and Color.withValues() are used throughout, and both
  # landed in Flutter 3.27 / Dart 3.6. Declaring anything lower would let the
  # package resolve on a toolchain it cannot actually compile against.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter

flutter:
