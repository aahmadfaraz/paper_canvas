name: scribe_canvas
description: >-
  Vendored fork of the scribe_canvas package (MIT, upstream v0.6.3), extended
  in-house with configurable page formats, vector paper templates, an unbounded
  2D canvas mode and shape tools. See VENDORING.md for the fork rationale and
  the list of local changes.
version: 0.6.3+schoolhack.1
publish_to: none
repository: https://github.com/aahmadfaraz/scribe_canvas

environment:
  # Upstream declares ^3.11.0, which the app's pinned toolchain (Flutter
  # 3.38.5 / Dart 3.10.4, see .fvmrc) does not satisfy. The source does not
  # actually use any 3.11 language feature, so the floor is lowered here to
  # match the app.
  sdk: ">=3.4.3 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0
  pdf: ^3.11.0
  printing: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
